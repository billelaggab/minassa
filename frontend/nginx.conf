# الباكند متاح فقط داخل شبكة edge باسم backend:8000 — لا كشف مباشر
upstream backend_up {
  server backend:8000;
}

server {
  listen 80;
  server_name _;
  charset utf-8;

  # الواجهة المبنية
  root /usr/share/nginx/html;
  index index.html;

  # سياسات أمان صارمة + عمل دون إنترنت تماما
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' http: https:;" always;

  # الخطوط المحلية — كاش طويل
  location /fonts/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # بروكسي API + الملفات نحو الباكند
  location /api/ {
    proxy_pass http://backend_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    client_max_body_size 120m;
  }

  location /files/ {
    proxy_pass http://backend_up;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    client_max_body_size 120m;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
