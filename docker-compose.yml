version: "3.9"

# منظومة إدارة جهات الاتصال والاستخبارات للصحفيين الاستقصائيين
# شبكة داخلية معزولة — لا يُكشف إلا الواجهة عبر localhost

networks:
  internal:
    driver: bridge
    internal: true
  edge:
    driver: bridge

volumes:
  pgdata:
    name: intel_pgdata
  meilidata:
    name: intel_meilidata
  uploads:
    name: intel_uploads

services:
  db:
    image: postgres:15-alpine
    container_name: intel_db
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intel_strong_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-inteldb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intel}"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: intel_search
    restart: unless-stopped
    networks:
      - internal
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_master_change_me_32chars}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: intel_backend
    restart: unless-stopped
    networks:
      - internal
      - edge
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aquilajournalist
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_master_change_me_32chars}
      API_TOKEN: ${API_TOKEN:-dev_token_change_me}
      UPLOAD_DIR: /uploads
      MAX_UPLOAD_MB: "100"
    volumes:
      - uploads:/uploads
    # لا ننشر منفذ الباكند للخارج — يتواصل عبر شبكة edge مع الفرونت فقط
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: intel_frontend
    restart: unless-stopped
    networks:
      - edge
    depends_on:
      - backend
    ports:
      - "${FRONT_PORT:-8080}:80"
